[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "face-attendance-system"
version = "1.2.0"
description = "Student attendance system using face recognition, WebRTC and SQLite"
requires-python = ">=3.11"
dependencies = [
  "streamlit>=1.37,<2",
  "streamlit-webrtc>=0.47,<1",
  "av>=12,<16",
  "opencv-python-headless>=4.10,<5",
  "face-recognition>=1.3,<2",
  "Pillow>=10,<12",
  "python-dotenv>=1,<2",
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.5,<1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--strict-markers -p no:cacheprovider --basetemp=.pytest_tmp"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "N"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"app.py" = ["E402"]

[tool.coverage.run]
source = ["src/face_attendance"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
