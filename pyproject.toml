[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "face-attendance-system"
version = "1.1.0"
description = "Student attendance system using face recognition, WebRTC and SQLite"
requires-python = ">=3.11"
dependencies = [
  "streamlit>=1.37,<2",
  "streamlit-webrtc>=0.47,<1",
  "av>=12,<16",
  "opencv-python-headless>=4.10,<5",
  "face-recognition>=1.3,<2",
  "Pillow>=10,<12",
  "ImageHash>=4.3,<5",
  "python-dotenv>=1,<2",
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "httpx>=0.27,<1",
  "ruff>=0.5,<1",
  "mypy>=1.10,<2",
  "bandit>=1.7,<2",
  "pip-audit>=2.7,<3",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "N"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
strict = false
ignore_missing_imports = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.coverage.run]
source = ["src/face_attendance"]
omit = ["tests/*", "tools/*"]

[tool.coverage.report]
fail_under = 70.0
show_missing = true
